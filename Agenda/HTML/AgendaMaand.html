<!DOCTYPE html>
<html lang="en">
<!--Alles wat niet zichtbaar op de site moet staan-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Het Digitale Erf</title>
  <link href="../../CSS/agendaMaand.css" rel="stylesheet">
  <script src="agendaMaand.js" defer></script>
</head>

<!--Alles wat wel zichtbaar op de site moet staan-->

<body>
  <!--Dit is de header voor datum en account en terug naar dashboard knop. Deze blijft consistent door alle agenda's heen-->
  <div class="header">
    header
  </div>

  <!--Dit is waar de rest van de pagina in staat-->
  <div class="container">

    <!--1 Dit maakt de agenda navigatie knop aan-->
    <button class="agendaNavButton" id="agendaNavButtonBack">terug</button>
    <!--Dit bevat alles rondom de agenda zelf-->
    <div class="agendaContainer">

      <!--Dit bevat de agenda-->
      <div class="agenda">
        <div class="agendaGrid" id="agendaGrid">
          <!--Hierin komen de agenda dagen te staan. Dit wordt geregeld door javascript en php.-->
          <template id="agendaDagTemplate">
            <div class="agendaDag">
              <div class="agendaTop"> <!--Hier is de dag te staan-->
                1
              </div>
              <div class="agendaInfo"> <!--Hier staat de blokken aan tijd of evenementen-->
                <div id="timeElement1">
                  <style>
                    #timeElement1 {
                      height: 100%;
                      width: 100%;
                      background-color: brown;
                    }
                  </style>
                </div>
                <div id="timeElement2">
                  <style>
                    #timeElement2 {
                      height: 100%;
                      width: 100%;
                      background-color: rgb(159, 42, 165);
                    }
                  </style>
                </div>
                <div id="timeElement3">
                  <style>
                    #timeElement3 {
                      height: 100%;
                      width: 100%;
                      background-color: rgb(155, 165, 42);
                    }
                  </style>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!--Dit maakt de agenda overzicht knoppen aan-->
      <div class="agendaSelector">
        <button class="dayAgenda">dag overzicht</button>
        <button class="weekAgenda">week overzicht</button>
        <button class="monthAgenda">maand overzicht</button>
      </div>
    </div>

    <!--2 Dit maakt de agenda navigatie knop aan-->
    <button class="agendaNavButton" id="agendaNavButtonNext">volgende</button>
  </div>
</body>

</html>
